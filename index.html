<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano Tutor</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --ink: #1d1d1f; --muted: #6b6b6b; --line: #e6e2d9;
    --accent: #3b5bdb; --accent-soft: #edf2ff; --ok: #2b8a3e; --ok-soft: #ebfbee; --bad: #e03131; --bad-soft: #fff5f5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 2.2rem; margin: 0 0 6px; letter-spacing: -0.02em; }
  h2 { font-size: 1.35rem; margin: 4px 0 10px; }
  h3.section { margin: 28px 4px 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 0.85rem; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid transparent; padding: 9px 16px; }
  button:disabled { cursor: default; }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover:not(:disabled) { background: #364fc7; }
  .primary.soft { background: var(--accent-soft); color: var(--accent); }
  .primary.soft:hover { background: #dbe4ff; }
  .primary.big { padding: 12px 26px; font-size: 1.05rem; }
  .ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .ghost:hover:not(:disabled) { background: #fff; }
  .ghost:disabled { opacity: 0.4; }
  .link { background: none; border: none; color: var(--accent); padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
  .card { background: var(--card); border-radius: 16px; padding: 22px 24px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 18px rgba(0,0,0,.04); }
  .card.center { text-align: center; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
  .actions:empty { display: none; }

  /* home */
  .hero { padding: 10px 4px 20px; }
  .hero p { max-width: 620px; margin: 0 0 14px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; max-width: 320px; margin-bottom: 4px; }
  .bar div { height: 100%; background: var(--ok); }
  .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .level, .studio-card { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: 38px 1fr; column-gap: 10px; row-gap: 2px; }
  .level:hover:not(:disabled), .studio-card:hover { border-color: var(--accent); }
  .level .num { grid-row: span 3; width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; }
  .level.passed .num { background: var(--ok); color: #fff; }
  .level.locked { opacity: 0.55; }
  .level.locked .num { background: #eee; color: #999; }
  .lt { font-weight: 650; }
  .lb { color: var(--muted); font-size: 0.88rem; }
  .ls { font-size: 0.85rem; color: var(--accent); margin-top: 4px; }
  .level.passed .ls { color: var(--ok); }
  .stars { color: #f59f00; letter-spacing: 1px; }
  .stars.big { font-size: 2rem; }
  .studio-card { display: block; width: 100%; margin-top: 16px; background: linear-gradient(135deg, #fff, var(--accent-soft)); }
  .studio-card .lt { display: block; font-size: 1.1rem; margin-bottom: 2px; }
  footer { margin-top: 30px; text-align: center; font-size: 0.85rem; }

  /* level */
  .topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .ltitle { font-weight: 650; flex: 1; min-width: 180px; }
  .ltitle .muted { font-weight: 500; margin-right: 6px; }
  .tabs { display: flex; background: #ebe7de; border-radius: 12px; padding: 3px; }
  .tabs button { background: none; padding: 7px 16px; border-radius: 9px; color: var(--muted); }
  .tabs button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .text, .vtext { max-width: 680px; }
  .vtext:empty { display: none; }
  .music { margin: 14px 0 4px; }
  .music:empty { display: none; }
  .music svg.score { display: block; width: 100%; height: auto; margin: 0 auto; }
  .kbwrap { margin-top: 10px; }
  .kbwrap:empty { display: none; }
  svg.keyboard { display: block; width: 100%; height: auto; margin: 0 auto; touch-action: manipulation; }
  svg.keyboard .key { cursor: pointer; }
  svg.keyboard .key:hover rect { filter: brightness(0.93); }
  .score .hit { cursor: pointer; }
  .score .col.now { color: var(--accent); }
  .score .col.done { color: var(--ok); }
  .lhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .pianoAbove { margin: 12px 0 0; }
  .pianoAbove:empty { display: none; }
  .legend { text-align: center; color: var(--muted); margin-top: 4px; }
  .legend span { margin-left: 10px; }
  .out { text-align: center; min-height: 1.5em; margin-top: 8px; }
  .variants { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
  .pill { background: #f1efe9; padding: 6px 14px; border-radius: 999px; font-size: 0.92rem; }
  .pill.on { background: var(--accent); color: #fff; }
  .variants.stepper { align-items: center; gap: 12px; }
  .variants.stepper button { padding: 4px 14px; font-size: 1.2rem; line-height: 1.2; }
  .vlabel { font-weight: 650; }
  .nav { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; gap: 10px; }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: #d9d4c8; }
  .dots span.on { background: var(--accent); }

  /* quiz */
  .qhead { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; color: var(--muted); margin-bottom: 4px; }
  .qhead > span:first-child { font-weight: 650; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.78rem; }
  .qhead .link { margin-left: auto; }
  .tdots { display: flex; gap: 4px; margin-left: auto; }
  .tdots i { width: 10px; height: 10px; border-radius: 50%; background: #e3dfd5; }
  .tdots i.ok { background: var(--ok); } .tdots i.bad { background: var(--bad); } .tdots i.cur { background: var(--accent); }
  .prompt { text-align: center; }
  .answers { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
  .answers .ans { background: #f4f2ec; border: 1.5px solid transparent; min-width: 120px; padding: 11px 16px; font-weight: 550; }
  .answers .ans:hover:not(:disabled) { border-color: var(--accent); background: #fff; }
  .answers .ans.letter { min-width: 0; width: 56px; height: 56px; padding: 0; font-size: 1.3rem; font-weight: 700; }
  .answers .ans .kbd { display: inline-block; font-size: 0.72rem; color: var(--muted); border: 1px solid #d6d1c5; border-radius: 4px; padding: 0 5px; margin-right: 8px; vertical-align: 1px; }
  .answers .ans.letter .kbd { display: none; }
  .answers .ans.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .answers .ans.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .answers .ans:disabled:not(.right):not(.wrong) { opacity: 0.5; }
  .hint { margin: 0; }
  .feedback { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; text-align: center; }
  .verdict { font-weight: 650; font-size: 1.05rem; }
  .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
  .explain { max-width: 640px; margin: 8px auto 0; color: #333; }
  b.ok { color: var(--ok); } b.bad { color: var(--bad); }
  .big-score { font-size: 3.4rem; font-weight: 800; line-height: 1; }
  .big-score span { font-size: 1.4rem; color: var(--muted); font-weight: 600; }
  .big-score.ok { color: var(--ok); } .big-score.bad { color: var(--bad); }
  .review { margin-top: 12px; }
  .review .prompt { text-align: left; font-weight: 600; }
  .review .explain { margin-left: 0; }

  /* studio */
  .controls { display: flex; flex-wrap: wrap; gap: 12px 16px; }
  .controls label { display: flex; flex-direction: column; font-size: 0.8rem; color: var(--muted); gap: 3px; }
  .controls select { font: inherit; font-size: 0.95rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); max-width: 340px; }
  .controls input[type=range] { width: 150px; }
  .desc { margin: 14px 0 0; }
  .systems svg.score { display: block; width: 100%; height: auto; margin: 6px auto 0; }
  .transport { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 12px 0; }
  .transport .midibtn { margin-left: auto; font-size: 0.88rem; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 0.92rem; }
  .along { background: var(--accent-soft); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
  .along-row { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .along-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .target { font-size: 1.25rem; }

  /* bonus song */
  .bonus .by { margin: -6px 0 8px; }
  .look { margin: 0 0 6px; padding-left: 20px; max-width: 680px; }
  .look li { margin: 3px 0; }
  .score .col.miss { color: var(--bad); }
  .opts { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; margin: -4px 0 12px; font-size: 0.92rem; }
  .opts select { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .bonusbadge { color: #7048e8; margin-left: 6px; }
  .bestline { margin: 10px 0 0; }
  /* during play-along the step box + keyboard stay pinned to the bottom of the screen */
  .bonus.playing .dock { position: sticky; bottom: 0; z-index: 2; background: var(--card); margin: 0 -8px; padding: 8px 8px 6px; border-radius: 12px 12px 0 0; box-shadow: 0 -10px 16px -12px rgba(0,0,0,.25); }
  .bonus.playing .dock .along { margin-bottom: 8px; }
  .toggles { display: flex; gap: 6px; }

  /* phones */
  html { touch-action: manipulation; }
  svg.keyboard { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .pill { white-space: nowrap; }
  .narrow, .rotatetip { display: none; }
  @media (max-width: 560px) {
    .wide { display: none; }
    .narrow { display: inline; }
    /* keyboards keep tappable keys (~28px white keys) and scroll sideways */
    .kbwrap, .pianoAbove { overflow-x: auto; overscroll-behavior-x: contain; }
    svg.keyboard { max-width: none !important; width: max(100%, calc(var(--whites, 15) * 28px)); }
    .tabs { width: 100%; }
    .tabs button { flex: 1; padding: 7px 6px; }
    .lhead { flex-wrap: wrap; }
    .bonus.playing .alonghelp { display: none; }
    .along { padding: 8px 12px; }
    .target { font-size: 1rem; }
    .bonus.playing .along-row { flex-wrap: nowrap; align-items: center; }
    .hearc { padding: 6px 12px; }
  }
  @media (max-height: 500px) {
    .bonus.playing .alonghelp { display: none; }
    .bonus.playing .along { padding: 6px 12px; }
    .bonus.playing .along-row { flex-wrap: nowrap; align-items: center; }
    .bonus.playing .target { font-size: 1rem; }
    /* each line of music fits in the space above the pinned keyboard */
    .bonus.playing .systems svg.score { height: max(110px, calc(100vh - var(--dockh, 240px) - 16px)); width: auto; max-width: 100%; }
  }
  @media (max-width: 560px) and (orientation: portrait) {
    .rotatetip { display: block; }
  }

  @media (max-width: 560px) {
    .card { padding: 16px 14px; }
    .answers .ans { min-width: 0; flex: 1 1 40%; }
    .answers .ans.letter { flex: 0 0 auto; width: 44px; height: 48px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="music.js"></script>
<script src="levels.js"></script>
<script src="songs.js"></script>
<script src="app.js"></script>
</body>
</html>
